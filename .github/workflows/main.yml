name: Publicar en SmarterASP

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restaurar dependencias de Web y API
      run: |
        dotnet restore MasoksTech.Web/MasoksTech.Web.csproj
        dotnet restore MasoksTech.API/MasoksTech.API.csproj

    - name: Compilar y Publicar Proyecto Web (Frontend)
      run: |
        dotnet publish MasoksTech.Web/MasoksTech.Web.csproj -c Release -o ./publish --no-restore

    - name: Compilar y Publicar API (Backend)
      run: |
        dotnet publish MasoksTech.API/MasoksTech.API.csproj -c Release -o ./publish/api --no-restore

    - name: Subir todo por FTP a SmarterASP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: win8041.site4now.net
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /site1/
